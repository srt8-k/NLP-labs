name: Improve and save LAB6 and LAB10
on:
  push:
    paths:
      - ".github/workflows/improve-lab6-lab10.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lab: [LAB6, LAB10]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install notebook requirements
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q nbformat nbclient ipykernel ipython pandas numpy scikit-learn nltk kagglehub
          if [ "${{ matrix.lab }}" = "LAB6" ]; then
            python -m pip install -q gensim scipy
            python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install -q tensorflow-cpu
          fi
      - name: Run all notebook cells, save outputs and check for errors
        env:
          TF_CPP_MIN_LOG_LEVEL: 2
          TF_NUM_INTEROP_THREADS: 2
          TF_NUM_INTRAOP_THREADS: 2
          OMP_NUM_THREADS: 2
        run: python .github/scripts/execute_labs.py "${{ matrix.lab }}"
      - name: Save outputs artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verified-${{ matrix.lab }}
          path: executed/
          if-no-files-found: error
      - name: Save execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.lab }}
          path: run_reports/
          if-no-files-found: warn

  publish:
    needs: execute
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download notebooks that completed Run All
        uses: actions/download-artifact@v4
        with:
          pattern: verified-*
          merge-multiple: true
          path: executed/
      - name: Commit verified notebook outputs
        shell: bash
        run: |
          if [ ! -d executed ]; then
            echo "No successful notebook run to publish."
            exit 0
          fi
          shopt -s nullglob
          for lab in executed/LAB*; do
            cp "${lab}"/*.ipynb "${lab#executed/}/"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            for lab in executed/LAB*; do
              cp "${lab}"/*.ipynb "${lab#executed/}/"
            done
            git add 'LAB6/*.ipynb' 'LAB10/*.ipynb'
            if git diff --cached --quiet; then
              echo "No changes."
              exit 0
            fi
            git commit -m "Save verified improved LAB6 and LAB10 outputs"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
