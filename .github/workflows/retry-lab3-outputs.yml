name: Retry LAB3 output execution

on:
  push:
    paths:
      - ".github/workflows/retry-lab3-outputs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: |
          python -m pip install nbformat nbclient ipykernel ipython pandas numpy scikit-learn nltk kagglehub gensim scipy matplotlib emoji
          python - <<'PY'
          import nltk
          for name in ("punkt", "punkt_tab", "stopwords", "wordnet"):
              nltk.download(name, quiet=True)
          PY
      - name: Run LAB3 and save actual outputs
        run: python .github/scripts/execute_labs.py LAB3
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lab3-executed-output
          path: executed/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab3-execution-report
          path: run_reports/
          if-no-files-found: warn

  publish:
    needs: execute
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lab3-executed-output
          path: executed/
      - name: Push executed LAB3
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            cp executed/LAB3/*.ipynb LAB3/
            git add -- 'LAB3/*.ipynb'
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Save verified LAB3 outputs"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
