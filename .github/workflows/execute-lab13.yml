name: Run LAB13 and save outputs
on:
  push:
    paths:
      - ".github/workflows/execute-lab13.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: python -m pip install -q nbformat nbclient ipykernel scikit-learn
      - name: Run all cells in both notebooks
        run: python .github/scripts/execute_lab13.py
      - name: Save outputs to GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            git add LAB13/*.ipynb
            if git diff --cached --quiet; then
              echo "Outputs already committed."
              exit 0
            fi
            git commit -m "Save LAB13 executed notebook outputs"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
