name: Execute and save LAB12 outputs

on:
  push:
    paths:
      - ".github/workflows/execute-lab12.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-lab12:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install notebook libraries
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q nbformat nbclient ipykernel ipython "transformers>=4.47,<5" matplotlib
      - name: Run all cells and save real outputs
        run: python .github/scripts/execute_labs.py LAB12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LAB12-run-report
          path: run_reports/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LAB12-executed-notebook
          path: executed/LAB12/
          if-no-files-found: error
      - name: Publish executed notebook to GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            cp executed/LAB12/Lab12_Transformers.ipynb LAB12/Lab12_Transformers.ipynb
            git add LAB12/Lab12_Transformers.ipynb
            if git diff --cached --quiet; then
              echo "Outputs already saved."
              exit 0
            fi
            git commit -m "Save LAB12 Run All results and attention plot"
            if git push origin HEAD:main; then
              echo "Published saved notebook outputs."
              exit 0
            fi
            echo "GitHub push failed. Retrying with latest main."
            sleep 3
          done
          exit 1
